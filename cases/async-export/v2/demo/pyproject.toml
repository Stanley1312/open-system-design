[project]
name = "async-export-v2-demo"
version = "0.1.0"
description = "Interactive worker-pool visualizer for Async Export V2"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = ["pytest>=8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
